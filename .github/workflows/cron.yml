name: Cron Job

on:
  workflow_dispatch:

concurrency:
  group: rss-fetcher
  cancel-in-progress: false

jobs:
  run-rss:
    runs-on: ubuntu-latest

    env:
      HF_HOME: /github/home/.cache/huggingface
      TRANSFORMERS_CACHE: /github/home/.cache/huggingface

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2️⃣ Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3️⃣ Cache pip (fast dependency install)
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      # 4️⃣ Cache HuggingFace models (VERY IMPORTANT)
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: /github/home/.cache/huggingface
          key: hf-${{ runner.os }}-models
          restore-keys: |
            hf-${{ runner.os }}-

      # 5️⃣ Install dependencies (NO venv = faster + simpler)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt

      # 6️⃣ Preload all models once (prevents runtime downloads)
      - name: Preload ML models
        run: |
          python -c "
            from models import Summarizer, Paraphraser, ZeroShotClassifier, SentenceEmbedder
            Summarizer.get()
            Paraphraser.get()
            ZeroShotClassifier.get()
            SentenceEmbedder.get()
            "

      # 7️⃣ Run RSS pipeline
      - name: Run RSS Fetcher
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          python -m cron.main