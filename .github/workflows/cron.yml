name: Cron Job

on:
  workflow_dispatch:

concurrency:
  group: rss-fetcher
  cancel-in-progress: false

jobs:
  run-rss:
    runs-on: ubuntu-latest

    env:
      # ✅ FIXED PATH (important)
      HF_HOME: /home/runner/.cache/huggingface
      TRANSFORMERS_CACHE: /home/runner/.cache/huggingface

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2️⃣ Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3️⃣ Cache pip
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      # 4️⃣ Cache HuggingFace models (FIXED PATH)
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/huggingface
          key: hf-${{ runner.os }}-models
          restore-keys: |
            hf-${{ runner.os }}-

      # 5️⃣ Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt

      # 6️⃣ Ensure cache directory exists (extra safety)
      - name: Create HF cache dir
        run: mkdir -p /home/runner/.cache/huggingface

      # 7️⃣ Preload ML models (NO indentation issues)
      - name: Preload ML models
        run: |
          python -c "from fetchnews.models import Summarizer, Paraphraser, ZeroShotClassifier, SentenceEmbedder; Summarizer.get(); Paraphraser.get(); ZeroShotClassifier.get(); SentenceEmbedder.get()"

      # 8️⃣ Run pipeline
      - name: Run RSS Fetcher
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          python -m cron.main